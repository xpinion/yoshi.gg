<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Co-op Dashboard | yoshi.gg</title>
  
  <link rel="stylesheet" href="style.css">

  <style>
    .bty-container { max-width: 1400px; margin: 40px auto; padding: 0 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .dashboard-header { text-align: center; margin-bottom: 20px; font-size: 2.5em; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #111; }

    /* GOTM SHOWCASE */
    .gotm-section { background: #fff; border-radius: 12px; padding: 30px; margin-bottom: 40px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    .gotm-header { text-align: center; font-size: 1.2em; font-weight: bold; color: #666; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
    .hero-card { background: linear-gradient(135deg, #111, #333); color: #fff; border-radius: 12px; padding: 30px; text-align: center; margin-bottom: 20px; box-shadow: 0 8px 15px rgba(0,0,0,0.2); border-top: 4px solid #FFD700; }
    .hero-month { color: #FFD700; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; font-size: 0.9em; margin-bottom: 5px; }
    .hero-game { font-size: 2.5em; font-weight: 900; margin-bottom: 15px; }
    .hero-score { display: inline-block; background: #FFD700; color: #111; font-size: 1.5em; font-weight: 900; padding: 5px 20px; border-radius: 30px; }
    
    .past-gotm-grid { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
    .mini-gotm-card { flex: 0 0 auto; background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 15px; min-width: 200px; text-align: center; }
    .mini-month { font-size: 0.8em; color: #777; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
    .mini-game { font-weight: 600; color: #222; margin-bottom: 10px; font-size: 1.1em; }
    .mini-score { background: #333; color: #fff; padding: 3px 10px; border-radius: 4px; font-weight: bold; display: inline-block; }

    /* LEADERBOARDS & LISTS */
    .leaderboards-wrapper { display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; margin-bottom: 40px; }
    .leaderboard-column { flex: 1; min-width: 320px; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    .board-title { text-align: center; font-size: 1.5em; font-weight: bold; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #eee; }
    .yoshi-title { color: #2e7d32; }
    .apple-title { color: #c62828; }
    .combined-title { color: #673AB7; } 

    .game-card { display: flex; align-items: center; background: #f8f9fa; margin-bottom: 10px; border-radius: 8px; padding: 12px 15px; transition: transform 0.2s, box-shadow 0.2s; border-left: 5px solid #ccc; }
    .game-card:hover { transform: translateX(5px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .yoshi-card { border-left-color: #4CAF50; }
    .apple-card { border-left-color: #F44336; }
    .combined-card { border-left-color: #673AB7; }

    .rank-badge { font-weight: 900; font-size: 1.2em; color: #555; min-width: 45px; }
    .game-name { flex: 1; font-weight: 600; color: #222; font-size: 1.05em; padding-right: 10px; }
    .score-badge { background: #222; color: #fff; font-weight: bold; padding: 5px 10px; border-radius: 6px; font-size: 1.1em; white-space: nowrap; }
    .score-empty { color: #999; font-style: italic; font-size: 0.9em; text-align: center; width: 100%; display: block;}

    /* FEED EXTRAS */
    .scrollable-feed { max-height: 500px; overflow-y: auto; padding-right: 10px; }
    .scrollable-feed::-webkit-scrollbar { width: 6px; }
    .scrollable-feed::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .scrollable-feed::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    .scrollable-feed::-webkit-scrollbar-thumb:hover { background: #999; }
    
    /* Forces the date badge to always maintain space from the game name */
    .feed-date-badge { font-size: 1.05em; min-width: 65px; margin-right: 15px; color: #666; }
  </style>
</head>
<body>

  <div id="main-header"></div>

  <div class="bty-container">
    <div class="dashboard-header">Collaborative Dashboard</div>
    
    <div id="loading-text" style="text-align: center; font-family: Courier New;">Loading Multi-Database Dashboard...</div>

    <div id="gotm-container" class="gotm-section" style="display: none;">
      <div class="gotm-header">Game of the Month Showcase</div>
      <div id="hero-gotm"></div>
      <div id="past-gotm" class="past-gotm-grid"></div>
    </div>

    <div class="leaderboards-wrapper" id="boards-wrapper" style="display: none;">
      <div class="leaderboard-column">
        <div class="board-title yoshi-title">Yoshi's Top 25</div>
        <div id="yoshi-list"></div>
      </div>
      <div class="leaderboard-column">
        <div class="board-title combined-title">Combined (Out of 20)</div>
        <div id="combined-list"></div>
      </div>
      <div class="leaderboard-column">
        <div class="board-title apple-title">Apple's Top 25</div>
        <div id="apple-list"></div>
      </div>
    </div>

    <div id="activity-container" class="leaderboards-wrapper" style="display: none;">
      <div class="leaderboard-column">
        <div class="board-title yoshi-title" id="yoshi-feed-title">Yoshi's Completions</div>
        <div id="yoshi-feed" class="scrollable-feed"></div>
      </div>
      <div class="leaderboard-column">
        <div class="board-title apple-title" id="apple-feed-title">Apple's Completions</div>
        <div id="apple-feed" class="scrollable-feed"></div>
      </div>
    </div>

  </div>

  <script src="nav.js"></script>

  <script>
    async function loadDashboardData() {
      try {
        // Fetch BOTH JSON files simultaneously!
        const [btyResponse, metaResponse] = await Promise.all([
          fetch('bty_data.json'),
          fetch('metadata_data.json')
        ]);
        
        const btyData = await btyResponse.json();
        const metaData = await metaResponse.json();
        
        const btyRows = btyData.values;
        const metaRows = metaData.values;

        // Dynamic Year Title Generation
        const currentYear = new Date().getFullYear();
        document.getElementById('yoshi-feed-title').innerText = `Yoshi's ${currentYear} Completions`;
        document.getElementById('apple-feed-title').innerText = `Apple's ${currentYear} Completions`;
        
        // --- 1. SMART GAME OF THE MONTH (From bty_data) ---
        let currentMonthNum = new Date().getMonth() + 1; 
        let gotmArray = [];

        for (let i = 4; i <= 15; i++) {
          if (!btyRows[i]) continue;
          let rawText = btyRows[i][1] || ''; 
          let score = btyRows[i][2] || '';   

          if (rawText && rawText.includes('-')) {
            let parts = rawText.split(' - ');
            let rawMonth = parts[0].trim();
            let gameName = parts[1].trim();

            let numMatch = rawMonth.match(/^(\d{2})/);
            if (numMatch) {
              let mNum = parseInt(numMatch[1], 10);
              let nameMatch = rawMonth.match(/\((.*?)\)/);
              let cleanMonthName = nameMatch ? nameMatch[1] : rawMonth;

              if (mNum <= currentMonthNum) {
                gotmArray.push({ num: mNum, monthName: cleanMonthName, game: gameName, score: score });
              }
            }
          }
        }

        gotmArray.sort((a, b) => b.num - a.num);

        if (gotmArray.length > 0) {
          let topGotm = gotmArray[0];
          document.getElementById('hero-gotm').innerHTML = `
            <div class="hero-card">
              <div class="hero-month">${topGotm.monthName} Game of the Month</div>
              <div class="hero-game">${topGotm.game}</div>
              <div class="hero-score">${topGotm.score} / 10</div>
            </div>`;

          let pastHTML = '';
          for (let j = 1; j < gotmArray.length; j++) {
            pastHTML += `
              <div class="mini-gotm-card">
                <div class="mini-month">${gotmArray[j].monthName}</div>
                <div class="mini-game">${gotmArray[j].game}</div>
                <div class="mini-score">${gotmArray[j].score}</div>
              </div>`;
          }
          document.getElementById('past-gotm').innerHTML = pastHTML;
          document.getElementById('gotm-container').style.display = 'block';
        }


        // --- 2. LEADERBOARDS (From bty_data) ---
        let yoshiGames = [];
        let appleGames = [];

        for (let i = 4; i <= 28; i++) {
          if (!btyRows[i]) continue; 
          let yGame = btyRows[i][9] || '';
          if (yGame) yoshiGames.push({ rank: btyRows[i][7] || '', score: btyRows[i][8] || '', name: yGame });

          let aGame = btyRows[i][13] || '';
          if (aGame) appleGames.push({ rank: btyRows[i][11] || '', score: btyRows[i][12] || '', name: aGame });
        }

        let yoshiHTML = '';
        yoshiGames.forEach(game => {
          let rText = game.rank ? `#${game.rank}` : ''; 
          let sHTML = game.score !== '' ? `<div class="score-badge">${game.score}</div>` : `<div class="score-empty">Unrated</div>`;
          yoshiHTML += `<div class="game-card yoshi-card"><div class="rank-badge">${rText}</div><div class="game-name">${game.name}</div>${sHTML}</div>`;
        });

        let appleHTML = '';
        appleGames.forEach(game => {
          let rText = game.rank ? `#${game.rank}` : ''; 
          let sHTML = game.score !== '' ? `<div class="score-badge">${game.score}</div>` : `<div class="score-empty">Unrated</div>`;
          appleHTML += `<div class="game-card apple-card"><div class="rank-badge">${rText}</div><div class="game-name">${game.name}</div>${sHTML}</div>`;
        });

        let combinedGames = [];
        yoshiGames.forEach(y => {
          let yNum = parseFloat(y.score);
          if (!isNaN(yNum)) {
            let match = appleGames.find(a => a.name.toLowerCase().trim() === y.name.toLowerCase().trim());
            if (match) {
              let aNum = parseFloat(match.score);
              if (!isNaN(aNum)) combinedGames.push({ name: y.name, totalScore: yNum + aNum });
            }
          }
        });
        combinedGames.sort((a, b) => b.totalScore - a.totalScore);

        let combinedHTML = '';
        if (combinedGames.length > 0) {
          combinedGames.forEach((game, index) => {
            let displayScore = Number.isInteger(game.totalScore) ? game.totalScore : game.totalScore.toFixed(1);
            combinedHTML += `<div class="game-card combined-card"><div class="rank-badge">#${index + 1}</div><div class="game-name">${game.name}</div><div class="score-badge" style="background: #673AB7;">${displayScore} <span style="font-size:0.7em; color:#bbb;">/ 20</span></div></div>`;
          });
        } else {
          combinedHTML = `<div class="score-empty" style="margin-top: 20px;">No shared rated games yet!</div>`;
        }

        document.getElementById('yoshi-list').innerHTML = yoshiHTML;
        document.getElementById('apple-list').innerHTML = appleHTML;
        document.getElementById('combined-list').innerHTML = combinedHTML;
        document.getElementById('boards-wrapper').style.display = 'flex';


        // --- 3. THE FEED ENGINE ---
        
        // YOSHI'S FEED (Parsed from bty_data)
        let yoshiFeedHTML = '';
        for (let i = 19; i < btyRows.length; i++) {
          if (!btyRows[i]) continue;
          let yCell = btyRows[i][1] || '';
          let yScore = btyRows[i][2] || '';
          
          if (yCell.includes('/') && yCell.includes(' - ')) {
            let parts = yCell.split(' - ');
            let date = parts.shift().trim(); 
            let game = parts.join(' - ').trim(); 
            let sBadge = yScore ? `<div class="score-badge">${yScore}</div>` : '';

            // Using the new feed-date-badge class for guaranteed spacing
            yoshiFeedHTML += `
              <div class="game-card yoshi-card">
                <div class="rank-badge feed-date-badge">${date}</div>
                <div class="game-name">${game}</div>
                ${sBadge}
              </div>`;
          }
        }

        // APPLE'S FEED (Pulled directly from metadata_data.json!)
        let appleActivities = [];
        
        // Loop through metadata (Start at 1 to skip header row)
        for(let i = 1; i < metaRows.length; i++) {
          if (!metaRows[i]) continue;
          let aGame = metaRows[i][0] || '';   // Column A (Videogame)
          let aScore = metaRows[i][7] || '';  // Column H (Apple Score)
          let aDate = metaRows[i][8] || '';   // Column I (yyyy/mm/dd)

          if (aDate && aDate.trim() !== '') {
            // Check if the completion date is in the current year
            if (aDate.startsWith(currentYear.toString())) {
              
              // Convert "2026/03/21" into "03/21" to match Yoshi's format
              let parts = aDate.split('/');
              let shortDate = parts.length === 3 ? `${parts[1]}/${parts[2]}` : aDate;

              appleActivities.push({
                rawDate: aDate, // Stored for accurate sorting
                displayDate: shortDate,
                game: aGame,
                score: aScore
              });
            }
          }
        }

        // Sort Apple's feed chronologically descending (Newest first)
        appleActivities.sort((a, b) => b.rawDate.localeCompare(a.rawDate));

        let appleFeedHTML = '';
        appleActivities.forEach(act => {
          let sBadge = act.score ? `<div class="score-badge">${act.score}</div>` : '';
          appleFeedHTML += `
            <div class="game-card apple-card">
              <div class="rank-badge feed-date-badge">${act.displayDate}</div>
              <div class="game-name">${act.game}</div>
              ${sBadge}
            </div>`;
        });

        // Inject Feeds
        document.getElementById('yoshi-feed').innerHTML = yoshiFeedHTML || '<div class="score-empty"><br>No completions logged for this year yet.</div>';
        document.getElementById('apple-feed').innerHTML = appleFeedHTML || '<div class="score-empty"><br>No completions logged for this year yet.</div>';
        document.getElementById('activity-container').style.display = 'flex';

        document.getElementById('loading-text').style.display = 'none';

      } catch (err) {
        document.getElementById('loading-text').innerHTML = '<span style="color: red;">Error loading dashboard data. Make sure both bty_data.json and metadata_data.json are uploaded!</span>';
        console.error(err);
      }
    }

    loadDashboardData();
  </script>
</body>
</html>
