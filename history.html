<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On This Day in History | yoshi xcx's Videogame Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <header id="global-header"></header>
  <main class="dashboard-container">
    <section class="card-row grid-1">
      <div class="card" style="max-height: none;">
        <div class="card-header">
          <h2 style="font-size: 2rem;">
            On This Day in History: 
            <select id="history-day-select" class="header-dropdown" style="font-size: 2rem;"></select>
          </h2>
        </div>
        <div class="card-content" id="history-page-container">
          <div class="loading-text">Loading History...</div>
        </div>
      </div>
    </section>
  </main>
  <div id="game-tooltip" class="game-tooltip"></div>
  <script src="app.js"></script>
</body>
</html>
