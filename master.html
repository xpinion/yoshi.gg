<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Games | yoshi xcx's Videogame Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Injected dynamically by js/core.js -->
  <header id="global-header"></header>

  <!-- Every game ever played, drawn by js/master.js -->
  <main class="dashboard-container master-container" id="master-page-container">
    <div class="loading-text">Loading All Games...</div>
  </main>

  <!-- Tooltip container -->
  <div id="game-tooltip" class="game-tooltip"></div>

  <script src="js/core.js"></script>
  <script src="js/master.js"></script>
</body>
</html>
