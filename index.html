<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoshi's Videogame Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <header class="dashboard-header">
    <h1>YOSHI'S VIDEOGAME DASHBOARD</h1>
  </header>

  <main class="dashboard-container">
    
    <section class="card-row grid-1">
      <div class="card">
        <div class="card-header">
          <h2>Monthly Summary: <select id="month-select" class="header-dropdown"></select></h2>
        </div>
        <div class="card-content" id="monthly-summary-list">
          <div class="loading-text">Loading Data...</div>
        </div>
      </div>
    </section>

    <section class="card-row grid-4">
      <div class="card">
        <div class="card-header">
          <h2>Yoshi's <select id="year-select-comp" class="header-dropdown"></select> Completions</h2>
        </div>
        <div class="card-content" id="completions-list"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Most Played <select id="year-select-played" class="header-dropdown"></select></h2>
        </div>
        <div class="card-content" id="most-played-list"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Most Days Played</h2>
        </div>
        <div class="card-content" id="most-days-list"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Longest Single Session</h2>
        </div>
        <div class="card-content" id="longest-session-list"></div>
      </div>
    </section>

    <section class="card-row grid-3">
      <div class="card">
        <div class="card-header">
          <h2><select id="top100-year-select" class="header-dropdown"></select> Top 100</h2>
        </div>
        <div class="card-content" id="top100-list"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Franchise: <select id="franchise-select" class="header-dropdown"></select></h2>
        </div>
        <div class="card-content" id="franchise-list"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Genre: <select id="genre-select" class="header-dropdown"></select></h2>
        </div>
        <div class="card-content" id="genre-list"></div>
      </div>
    </section>

<section class="card-row" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px;">
      
      <div class="card">
        <div class="card-header">
          <h2>On This Day (<span id="today-date"></span>)</h2>
        </div>
        <div class="card-content" id="on-this-day-list"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Spotlight: <select id="random-top25-select" class="header-dropdown"></select></h2>
        </div>
        <div class="card-content" id="random-top25-content" style="padding: 0;"></div>
      </div>

    </section>

    <section class="card-row" style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
      
      <div class="card">
        <div class="card-header">
          <h2>Data Analysis: 
            <select id="analysis-select" class="header-dropdown">
              <option value="playthrough">Playthrough Stats</option>
              <option value="gameSummary">Game Timeframe Summary</option>
              <option value="genreSummary">Genre Timeframe Summary</option>
              <option value="dayOfWeek">Day of Week Stats</option>
              <option value="genre">Genre Stats</option>
              <option value="releaseYear">Release Year Stats</option>
              <option value="developer">Developer Stats</option>
              <option value="publisher">Publisher Stats</option>
            </select>
          </h2>
        </div>
        <div class="card-content" id="analysis-content" style="padding: 0;"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Milestone Tracker</h2>
        </div>
        <div class="card-content" id="milestones-list"></div>
      </div>

    </section>

    <section class="card-row grid-1">
      <div class="card">
        <div class="card-header">
          <h2>Calendar Heatmap: 
            <select id="heatmap-select" class="header-dropdown">
              <option value="days">Days Played (Years Played / Possible Years)</option>
              <option value="time">Total Time Spent</option>
            </select>
          </h2>
        </div>
        <div class="card-content" id="heatmap-content" style="overflow-x: auto; padding: 0;"></div>
      </div>
    </section>
  </main>

  <div id="game-tooltip" class="game-tooltip"></div>

  </main>

  <script src="app.js"></script>
</body>
</html>
